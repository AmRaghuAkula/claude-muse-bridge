name: deploy-azure

# Deploys the bridge to Azure Container Apps on every push to main.

# Builds the Docker image in Azure (no local Docker needed) and rolls it out
# to the Container App. Authenticates with OIDC — no passwords stored in GitHub.
# One-time GUI setup: repo Settings -> Secrets and variables -> Actions, add
# these repository secrets (values come from the Deploy-to-Azure outputs):
#   AZURE_DEPLOYER_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   AZURE_ACR_NAME, AZURE_RESOURCE_GROUP

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}" ] && missing="$missing AZURE_DEPLOYER_CLIENT_ID"
          [ -z "${{ secrets.AZURE_TENANT_ID }}" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -z "${{ secrets.AZURE_ACR_NAME }}" ] && missing="$missing AZURE_ACR_NAME"
          [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ] && missing="$missing AZURE_RESOURCE_GROUP"
          if [ -n "$missing" ]; then
            echo "These repository secrets are missing or empty:$missing"
            echo "Add them under repo Settings -> Secrets and variables -> Actions -> Repository secrets,"
            echo "using the exact names above, then re-run this workflow."
            exit 1
          fi
          echo "All required secrets present."

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in Azure
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --image bridge:${{ github.sha }} \
            --image bridge:latest \
            .

      - name: Roll out to Container App
        run: |
          LOGIN_SERVER=$(az acr show --name ${{ secrets.AZURE_ACR_NAME }} \
            --query loginServer -o tsv)
          az containerapp update \
            --name claude-muse-bridge \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image "$LOGIN_SERVER/bridge:${{ github.sha }}"

# trigger: re-run after federated credential subject fix
