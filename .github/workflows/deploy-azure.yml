name: deploy-azure

# Deploys the bridge to Azure Container Apps on every push to main.

# Builds the Docker image in Azure (no local Docker needed) and rolls it out
# to the Container App. Authenticates with OIDC — no passwords stored in GitHub.
# One-time GUI setup: repo Settings -> Secrets and variables -> Actions, add
# these repository secrets (values come from the Deploy-to-Azure outputs):
#   AZURE_DEPLOYER_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   AZURE_ACR_NAME, AZURE_RESOURCE_GROUP
# For the Claude watcher job, also add:
#   secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (IAM user with
#     bedrock:InvokeModel on the Claude model)
#   variables: AWS_REGION (e.g. us-east-1),
#     BEDROCK_MODEL_ID (e.g. global.anthropic.claude-sonnet-4-6)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}" ] && missing="$missing AZURE_DEPLOYER_CLIENT_ID"
          [ -z "${{ secrets.AZURE_TENANT_ID }}" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -z "${{ secrets.AZURE_ACR_NAME }}" ] && missing="$missing AZURE_ACR_NAME"
          [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ] && missing="$missing AZURE_RESOURCE_GROUP"
          if [ -n "$missing" ]; then
            echo "These repository secrets are missing or empty:$missing"
            echo "Add them under repo Settings -> Secrets and variables -> Actions -> Repository secrets,"
            echo "using the exact names above, then re-run this workflow."
            exit 1
          fi
          echo "All required secrets present."

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in Azure
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --image bridge:${{ github.sha }} \
            --image bridge:latest \
            .

      - name: Roll out to Container App
        run: |
          LOGIN_SERVER=$(az acr show --name ${{ secrets.AZURE_ACR_NAME }} \
            --query loginServer -o tsv)
          az containerapp update \
            --name claude-muse-bridge \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image "$LOGIN_SERVER/bridge:${{ github.sha }}"

      - name: Deploy watcher job
        # Scheduled Container Apps Job that nudges Claude (via Bedrock) when
        # watched channels get new messages. Skips cleanly until the AWS
        # secrets above are added; the bridge app deploy above is unaffected.
        run: |
          set -euo pipefail
          # Surface the failing command as a run annotation (readable via API).
          trap 'echo "::error::watcher deploy failed at: $BASH_COMMAND"' ERR
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "AWS Bedrock secrets not set - skipping watcher job deployment."
            exit 0
          fi
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          ACR="${{ secrets.AZURE_ACR_NAME }}"
          LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
          IMAGE="$LOGIN_SERVER/bridge:${{ github.sha }}"
          ENV_ID=$(az containerapp env show --name cae-bridge \
            --resource-group "$RG" --query id -o tsv)
          STORAGE=$(az storage account list --resource-group "$RG" \
            --query "[?starts_with(name,'stbridge')].name | [0]" -o tsv)
          LOCATION=$(az group show --name "$RG" --query location -o tsv)
          [ -n "$ENV_ID" ] && [ -n "$STORAGE" ] \
            || { echo "Could not find container env or storage account" >&2; exit 1; }
          echo "Env: $ENV_ID | Storage: $STORAGE | Image: $IMAGE"

          # Watcher managed identity (idempotent) + least-privilege roles.
          echo "Creating watcher identity..."
          IDENTITY_ID=$(az identity create --name id-bridge-watcher \
            --resource-group "$RG" --location "$LOCATION" --query id -o tsv)
          PRINCIPAL=$(az identity show --ids "$IDENTITY_ID" \
            --query principalId -o tsv)
          STORAGE_ID=$(az storage account show --name "$STORAGE" \
            --resource-group "$RG" --query id -o tsv)
          ACR_ID=$(az acr show --name "$ACR" \
            --resource-group "$RG" --query id -o tsv)
          [ -n "$IDENTITY_ID" ] && [ -n "$PRINCIPAL" ] \
            && [ -n "$STORAGE_ID" ] && [ -n "$ACR_ID" ] \
            || { echo "Failed to resolve Azure resource IDs" >&2; exit 1; }
          # Role assignments can race Azure AD replication right after the
          # identity is created, so retry for a bit. But a hard
          # AuthorizationFailed means the deployer identity was never granted
          # permission to assign roles at all — retrying won't help, so fail
          # fast with the exact one-time portal fix.
          ensure_role() { # $1 = role definition id, $2 = scope
            local attempt=0
            while [ -z "$(az role assignment list --assignee "$PRINCIPAL" \
                --role "$1" --scope "$2" --query "[0].id" -o tsv)" ]; do
              attempt=$((attempt + 1))
              if [ "$attempt" -gt 18 ]; then
                echo "::error::Timed out assigning role $1 on $2. Last error: $(cat /tmp/role_err.txt 2>/dev/null)"
                echo "Timed out assigning role $1 on $2" >&2
                exit 1
              fi
              if az role assignment create --assignee-object-id "$PRINCIPAL" \
                  --assignee-principal-type ServicePrincipal \
                  --role "$1" --scope "$2" -o none 2>/tmp/role_err.txt; then
                echo "Role $1 assigned on $2"
                break
              fi
              if grep -q "AuthorizationFailed" /tmp/role_err.txt 2>/dev/null; then
                # The deployer identity can't grant roles (it lacks
                # Microsoft.Authorization/roleAssignments/write), and the
                # portal requires a delegation condition for privileged roles,
                # so the roles are granted once via the portal instead (see
                # docs/azure-deploy.md "One-time permission for the watcher").
                # Warn and continue so the job itself still deploys; the
                # watcher works as long as the portal grants are in place.
                echo "::warning::Deployer identity 'id-bridge-deployer' cannot grant role $1 on $2 (AuthorizationFailed). Continuing — grant it via the portal if not already done (docs/azure-deploy.md)."
                echo "WARNING: cannot grant role $1 on $2; continuing. If the watcher later fails with an authorization error, grant the role via the portal." >&2
                break
              fi
              echo "Role assignment not ready (attempt $attempt/18), retrying in 10s..." >&2
              sleep 10
            done
          }
          # Storage Blob Data Contributor, AcrPull
          ensure_role ba92f5b4-2d11-453d-a403-e96b0029c9fe "$STORAGE_ID"
          ensure_role 7f951dda-4ed3-4680-a7ca-43fe172d538d "$ACR_ID"

          AWS_REGION="${{ vars.AWS_REGION }}"
          AWS_REGION="${AWS_REGION:-us-east-1}"
          BEDROCK_MODEL="${{ vars.BEDROCK_MODEL_ID }}"
          BEDROCK_MODEL="${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}"

          ENV_VARS="BRIDGE_BACKEND=azure"
          ENV_VARS="$ENV_VARS BRIDGE_STORAGE_ACCOUNT=$STORAGE"
          ENV_VARS="$ENV_VARS BRIDGE_CHANNELS_CONTAINER=channels"
          ENV_VARS="$ENV_VARS BRIDGE_CONTAINER=briefs"
          ENV_VARS="$ENV_VARS WATCH_CHANNELS=voice-agent-gtm"
          ENV_VARS="$ENV_VARS WATCH_STATE_CONTAINER=watcher-state"
          ENV_VARS="$ENV_VARS AWS_REGION=$AWS_REGION"
          ENV_VARS="$ENV_VARS BEDROCK_MODEL_ID=$BEDROCK_MODEL"
          ENV_VARS="$ENV_VARS AWS_ACCESS_KEY_ID=secretref:aws-access-key-id"
          ENV_VARS="$ENV_VARS AWS_SECRET_ACCESS_KEY=secretref:aws-secret-access-key"
          # shellcheck disable=SC2086
          if az containerapp job show --name bridge-watcher \
              --resource-group "$RG" >/dev/null 2>&1; then
            echo "Updating existing bridge-watcher job..."
            if ! az containerapp job update --name bridge-watcher \
              --resource-group "$RG" \
              --image "$IMAGE" \
              --set-env-vars $ENV_VARS \
              --set-secrets \
                "aws-access-key-id=${{ secrets.AWS_ACCESS_KEY_ID }}" \
                "aws-secret-access-key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              2>/tmp/job_err.txt; then
              echo "::error::bridge-watcher job update failed: $(cat /tmp/job_err.txt)"
              exit 1
            fi
          else
            echo "Creating bridge-watcher job..."
            # NOTE: --args="-m" uses the attached form so the CLI parser takes
            # the dash-prefixed value literally (a bare "-m" is rejected as a
            # usage error, exit code 2).
            if ! az containerapp job create --name bridge-watcher \
              --resource-group "$RG" \
              --environment "$ENV_ID" \
              --trigger-type Schedule \
              --cron-expression "*/15 * * * *" \
              --replica-timeout 600 \
              --image "$IMAGE" \
              --cpu 0.5 --memory 1Gi \
              --command=python --args="-m" "bridge.watcher" \
              --registry-server "$LOGIN_SERVER" \
              --registry-identity "$IDENTITY_ID" \
              --mi-user-assigned "$IDENTITY_ID" \
              --env-vars $ENV_VARS \
              --secrets \
                "aws-access-key-id=${{ secrets.AWS_ACCESS_KEY_ID }}" \
                "aws-secret-access-key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              2>/tmp/job_err.txt; then
              echo "::error::bridge-watcher job create failed: $(cat /tmp/job_err.txt)"
              exit 1
            fi
          fi
          echo "Watcher job deployed."

# trigger: re-run after federated credential subject fix
