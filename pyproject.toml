[project]
name = "claude-muse-bridge"
version = "0.3.0"
description = "An MCP bridge that lets Claude read briefs and reports produced by Muse (or anyone)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2",
    "uvicorn>=0.30",
    "anthropic>=0.40",
    "boto3>=1.34",
]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12", "azure-identity>=1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
